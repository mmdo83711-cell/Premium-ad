<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-crown"></i>
                <h1>প্রিমিয়াম অ্যাপস</h1>
                <p>অ্যাডমিন কন্ট্রোল প্যানেল</p>
            </div>
        </div>

        <div class="login-card">
            <h2><i class="fas fa-sign-in-alt"></i> লগইন করুন</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> ইমেইল ঠিকানা
                    </label>
                    <input type="email" id="email" placeholder="admin@example.com" required>
                    <div class="predefined-emails">
                        <small>টেস্ট অ্যাকাউন্ট: admin@gmail.com</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> পাসওয়ার্ড
                    </label>
                    <input type="password" id="password" placeholder="পাসওয়ার্ড দিন" required>
                    <div class="predefined-emails">
                        <small>টেস্ট পাসওয়ার্ড: admin123</small>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> লগইন
                    </button>
                    <button type="button" id="testLogin" class="btn btn-outline btn-block" style="margin-top: 10px;">
                        <i class="fas fa-bug"></i> টেস্ট লগইন
                    </button>
                </div>
            </form>

            <div class="login-footer">
                <p><i class="fas fa-info-circle"></i> Firebase Auth ID: evsChZtUo9SU65gcKO0XluqoeH32</p>
                <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">
                    সমস্যা হলে F12 চাপুন এবং Console চেক করুন
                </p>
            </div>
        </div>

        <div id="statusMessage" class="status-message"></div>
    </div>

    <script src="auth.js" type="module"></script>
</body>
</html>
