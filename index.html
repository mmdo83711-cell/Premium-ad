<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন - প্রিমিয়াম অ্যাপস</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script type="module" src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-crown"></i>
                <h1>প্রিমিয়াম অ্যাপস</h1>
                <p>অ্যাডমিন প্যানেল</p>
            </div>
        </div>

        <div class="login-card">
            <h2>অ্যাডমিন লগইন</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> ইমেইল
                    </label>
                    <input type="email" id="email" placeholder="admin@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> পাসওয়ার্ড
                    </label>
                    <input type="password" id="password" placeholder="********" required>
                    <button type="button" class="show-password" id="showPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> লগইন করুন
                    </button>
                </div>
            </form>

            <div class="login-footer">
                <p>শুধুমাত্র অথোরাইজড অ্যাডমিনের প্রবেশাধিকার রয়েছে</p>
            </div>
        </div>

        <div class="login-alert" id="loginAlert"></div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">লোড হচ্ছে...</p>
    </div>

    <!-- Scripts -->
    <script src="main.js" type="module"></script>
</body>
</html>
