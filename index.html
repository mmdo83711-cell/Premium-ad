<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন - প্রিমিয়াম অ্যাপস</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script type="module" src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-crown"></i>
                <h1>প্রিমিয়াম অ্যাপস</h1>
                <p>অ্যাডমিন প্যানেল</p>
            </div>
        </div>

        <div class="login-card">
            <h2>অ্যাডমিন লগইন</h2>
            
            <!-- ডিবাগ বাটন -->
            <div style="text-align: center; margin-bottom: 20px;">
                <button id="testConnection" class="btn btn-outline" style="font-size: 0.8rem;">
                    <i class="fas fa-wifi"></i> কানেকশন টেস্ট
                </button>
                <button id="createAdminBtn" class="btn btn-outline" style="font-size: 0.8rem; margin-left: 10px;">
                    <i class="fas fa-user-plus"></i> অ্যাডমিন তৈরি
                </button>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> ইমেইল
                    </label>
                    <input type="email" id="email" placeholder="admin@example.com" required 
                           value="admin@gmail.com">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> পাসওয়ার্ড
                    </label>
                    <input type="password" id="password" placeholder="********" required 
                           value="123456">
                    <button type="button" class="show-password" id="showPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> লগইন করুন
                    </button>
                </div>
            </form>

            <div class="login-footer">
                <p>শুধুমাত্র অথোরাইজড অ্যাডমিনের প্রবেশাধিকার রয়েছে</p>
                <p style="font-size: 0.75rem; margin-top: 10px; color: #666;">
                    <i class="fas fa-info-circle"></i>
                    লগইন সমস্যা হলে ব্রাউজার কনসোল চেক করুন (F12)
                </p>
            </div>
        </div>

        <div class="login-alert" id="loginAlert"></div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">লোড হচ্ছে...</p>
    </div>

    <!-- Scripts -->
    <script src="main.js" type="module"></script>
    
    <!-- Extra Debug Script -->
    <script>
        // টেস্ট কানেকশন বাটন
        document.getElementById('testConnection')?.addEventListener('click', () => {
            alert('কনসোল চেক করুন (F12)');
            console.log('=== Firebase Connection Test ===');
            console.log('Firebase Config:', firebaseConfig);
            console.log('Current URL:', window.location.href);
        });
    </script>
</body>
</html>
